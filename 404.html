<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PersonalSite</title>
    <script>
      // Encodes the path as a query param so index.html can restore it.
      // Keeps 1 segment (/PersonalSite) then appends ?/rest/of/path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/' +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
